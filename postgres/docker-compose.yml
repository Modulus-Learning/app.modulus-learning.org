name: modulus-postgres

services:
  db:
    # Core integration queries rely on PostgreSQL 18 OLD/NEW references in
    # RETURNING. Pin the local server to the same supported floor as CI.
    image: postgres:18
    container_name: modulus_postgres
    environment:
      POSTGRES_PASSWORD: test
    ports:
      - 5432:5432
    volumes:
      - type: bind
        source: ./data
        target: /var/lib/postgresql

  adminer:
    image: adminer
    profiles:
      - adminer
    ports:
      - 9000:8080
