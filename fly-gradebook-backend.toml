# Fly.io configuration for the Modulus gradebook BACKEND deployment.
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#
# BACKEND (admin + background jobs) deployment. Serves the administrative surface
# only -- the public/learner and LTI surface is blocked (404) -- and runs the
# background workers (LTI score-submission). The learner/LTI surface is served by
# the companion fly-gradebook-frontend.toml app. See docs/DEPLOYMENT.md.
#
# SAME IMAGE, both apps. DEPLOYMENT_MODE / JOB_QUEUE_ENABLED and all server-side
# config are read at RUNTIME from process.env, so this app and the frontend app
# deploy the identical image; the mode is purely an env switch.
#
# Build-time caveat (NEXT_PUBLIC_*): Next.js inlines NEXT_PUBLIC_* into the CLIENT
# bundle at `next build` from apps/gradebook/.env.public, so the client-baked
# NEXT_PUBLIC_PUBLIC_SERVER_URL is always the frontend origin and CANNOT vary by
# runtime env on a shared image. That is harmless here: the only client code that
# reads publicServerUrl is on the frontend/LTI surface (activities + LTI deep-link
# forms), which this admin backend blocks (404) and never serves.
#
# What DOES matter at runtime: getServerConfig().publicServerUrl is read live by
# withAdminSession, which self-fetches `${publicServerUrl}/routes/admin/refresh`
# to refresh admin tokens. That must resolve to THIS app's own origin, so the
# runtime server URL values below point at the admin subdomain. (/routes/admin is
# 404 on the frontend, so leaving them at the frontend origin would break admin
# token refresh.)
#
# This admin backend serves https://admin.modulus-learning.org -- you must add the
# DNS record and a Fly certificate for that subdomain.
app = 'modulus-gradebook-backend'
primary_region = 'sin'
swap_size_mb = 512

[build]
dockerfile = '_docker/gradebook/production/Dockerfile'

[build.args]
APP_VOLUME = '/app/storage'
IMAGE_VOLUME = '/app/apps/gradebook/.next/cache/images'

[deploy]
strategy = 'rolling'

[env]
PORT = '3000'
# Serve the admin surface only, and run the background workers on this instance.
DEPLOYMENT_MODE = 'admin'
JOB_QUEUE_ENABLED = 'true'

# NEXT_PUBLIC_SITE_NAME / DESCRIPTION / CSP are build-time inlined (see header) and
# identical across both apps.
NEXT_PUBLIC_SITE_NAME = 'MODULUS'
NEXT_PUBLIC_SITE_DESCRIPTION = 'Modulus - an open source educational analytics system for distributed learning content.'
# Runtime value = this backend's own origin (used server-side by the admin token
# refresh self-fetch). The client-baked value remains the frontend origin but is
# inert here (no admin client reads it) -- see header.
NEXT_PUBLIC_PUBLIC_SERVER_URL = 'https://admin.modulus-learning.org'
NEXT_PUBLIC_CSP_ENABLED = 'false'
DATA_REQUEST_CACHING = 'true'
ANALYTICS_ENABLED = 'true'

USER_SESSION_COOKIE_NAME = 'user_session'
USER_SESSION_COOKIE_SAME_SITE = 'none'
USER_SESSION_COOKIE_HTTP_ONLY = 'true'
USER_SESSION_COOKIE_SECURE = 'true'

USER_REFRESH_COOKIE_NAME = 'user_refresh'
USER_REFRESH_COOKIE_SAME_SITE = 'none'
USER_REFRESH_COOKIE_HTTP_ONLY = 'true'
USER_REFRESH_COOKIE_SECURE = 'true'

ADMIN_SESSION_COOKIE_NAME = 'admin_session'
ADMIN_SESSION_COOKIE_SAME_SITE = 'lax'
ADMIN_SESSION_COOKIE_HTTP_ONLY = 'true'
ADMIN_SESSION_COOKIE_SECURE = 'true'

ADMIN_REFRESH_COOKIE_NAME = 'admin_refresh'
ADMIN_REFRESH_COOKIE_SAME_SITE = 'lax'
ADMIN_REFRESH_COOKIE_HTTP_ONLY = 'true'
ADMIN_REFRESH_COOKIE_SECURE = 'true'

FLASH_COOKIE_NAME = 'flash'
FLASH_COOKIE_SAME_SITE = 'lax'
FLASH_COOKIE_HTTP_ONLY = 'true'
FLASH_COOKIE_SECURE = 'true'

API_BASE_URL = 'https://admin.modulus-learning.org/routes'
API_JWT_PUBLIC_KEY = ''
# JWT issuer/audience are kept IDENTICAL to the frontend (same signing key), so
# tokens stay interchangeable across both apps -- they are opaque claim strings
# that need only match between mint and verify, not the serving origin.
API_JWT_ISSUER = 'https://app.modulus-learning.org'
API_JWT_AUDIENCE = 'https://app.modulus-learning.org'

NEXT_PUBLIC_RECAPTCHA_ENABLED = 'true'
NEXT_PUBLIC_RECAPTCHA_MANDATORY = 'true'
