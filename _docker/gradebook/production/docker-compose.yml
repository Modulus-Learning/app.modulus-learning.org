services:
  app:
    image: 783978313898.dkr.ecr.ap-southeast-1.amazonaws.com/modulus:app-1.0.0
    container_name: modulus_app
    # .env holds the committed public values; .env.local the local secrets.
    env_file:
      - ./apps/gradebook/.env
      - path: ./apps/gradebook/.env.local
        required: false
    ports:
      - 80:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Override localhost references to reach host services (PostgreSQL, etc.)
      POSTGRES_CONNECTION_STRING: postgres://modulus:modulus@host.docker.internal:5432/modulus_dev
